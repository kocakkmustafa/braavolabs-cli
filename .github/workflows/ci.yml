name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # BR-P0-005: roadmap §9's CLI gate is install → test → lint → build →
      # `--help`. lint (tsc --noEmit) and the built-binary smoke check were both
      # missing, so a type error or a bin that fails to start could pass CI.
      - run: pnpm test
      - run: pnpm run lint
      # Tek istisna: GHSA-fc5q-39xc-vjpf (picomatch ReDoS). Yalnız dev yolu:
      # `pnpm why picomatch` → vitest/vite@7 > tinyglobby > fdir > picomatch (yayın
      # paketine girmez); yamalı sürüm yok (npm latest 4.0.7 de etkili).
      # Advisory: https://github.com/advisories/GHSA-fc5q-39xc-vjpf
      # Son tarih 2026-12-18: sonrasında istisna kalkar, tam denetim çalışır.
      # Başka hiçbir advisory susturulmaz.
      - run: |
          if [ "$(date -u +%F)" \> "2026-12-18" ]; then
            pnpm audit --audit-level=moderate
          else
            pnpm audit --audit-level=moderate --ignore GHSA-fc5q-39xc-vjpf
          fi
      - run: pnpm build
      # Runs the actual built artifact. `pnpm build` succeeding does not prove
      # the published bin starts — this is the cheapest possible proof it does.
      - run: node dist/braavo.js --help
