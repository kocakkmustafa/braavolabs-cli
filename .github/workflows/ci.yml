name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # BR-P0-005: roadmap §9's CLI gate is install → test → lint → build →
      # `--help`. lint (tsc --noEmit) and the built-binary smoke check were both
      # missing, so a type error or a bin that fails to start could pass CI.
      - run: pnpm test
      - run: pnpm run lint
      - run: pnpm audit --audit-level=moderate
      - run: pnpm build
      # Runs the actual built artifact. `pnpm build` succeeding does not prove
      # the published bin starts — this is the cheapest possible proof it does.
      - run: node dist/braavo.js --help
